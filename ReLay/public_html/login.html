<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Sign in to Relay as a client, courier, staff member or administrator.">
  <meta name="author" content="Group 05 — Enterprise Information Systems 2026/2027, FEUP">
  <title>Sign in — Relay</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="auth-header">
    <div class="container">
      <a href="index.html" class="logo">
        <span class="logo-mark">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><path d="M3.3 7 12 12l8.7-5M12 22V12"/></svg>
        </span>
        <span class="logo-text">Re<span>lay</span></span>
      </a>
      <a href="index.html" class="back-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>
        Back to Home
      </a>
    </div>
  </header>

  <main class="container login-wrap">
    <div class="login-photo" role="img" aria-label="Two couriers carrying a parcel"></div>

    <form class="login-form" action="client-profile.html" method="post">
      <h1>Nice to see you again.</h1>

      <div class="field form-row">
        <label for="email">Email *</label>
        <input class="input" type="email" id="email" name="email" autocomplete="email" required>
      </div>

      <div class="field form-row">
        <label for="password">Password *</label>
        <div class="input-wrap">
          <input class="input" type="password" id="password" name="password" autocomplete="current-password" minlength="8" required>
          <span class="suffix" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="#333"><path d="M12 5C5.5 5 2 12 2 12s3.5 7 10 7 10-7 10-7-3.5-7-10-7zm0 11a4 4 0 1 1 0-8 4 4 0 0 1 0 8zm0-6a2 2 0 1 0 0 4 2 2 0 0 0 0-4z"/></svg>
          </span>
        </div>
      </div>

      <div class="login-options">
        <label class="switch">
          <input type="checkbox" name="remember">
          <span class="track"></span>
          Remember me
        </label>
        <a href="#">Forgot password?</a>
      </div>

      <button type="submit" class="btn btn-primary btn-block">Sign in</button>

      <p class="login-footer">Don't have an account? &nbsp;<a href="register.html">Sign up now</a></p>

      <p class="demo-links">
        Demo access:
        <a href="client-profile.html">Client</a>·
        <a href="courier-active-order.html">Courier</a>·
        <a href="staff-approvals.html">Staff</a>·
        <a href="admin-panel.html">Admin</a>
      </p>
    </form>
  </main>

  <script src="js/data.js"></script>
  <script src="js/validation.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
