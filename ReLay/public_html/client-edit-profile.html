<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Client area: edit personal information and change the password.">
  <meta name="author" content="Group 05-Enterprise Information Systems 2026/2027, FEUP">
  <title>Edit profile - Relay</title>
  <link rel="icon" href="data:,">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app">

    <aside class="sidebar">
      <a href="index.html" class="logo">
        <span class="logo-mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><path d="M3.3 7 12 12l8.7-5M12 22V12"/></svg></span>
        <span class="logo-text">Re<span>lay</span></span>
      </a>
      <nav class="side-nav">
        <a href="client-orders.html">Orders</a>
        <a href="client-products.html">Products</a>
        <a href="client-profile.html" class="active">Profile</a>
      </nav>
      <a href="login.html" class="logout">← Log out</a>
    </aside>

    <div class="main">
      <header class="topbar">
        <h1>My profile</h1>
        <div class="user-box">
          <span class="alerts-pill" title="Order updates today">2 alerts</span>
          <span class="avatar"></span>
          <span class="who"><strong data-client-name>Ana Ferreira</strong><small>Client</small></span>
        </div>
      </header>

      <main class="content">
        <section class="card profile-head">
          <span class="avatar lg"></span>
          <div>
            <h2><span data-client-name>Ana Ferreira</span> <span class="badge badge-blue">Client</span></h2>
            <p><span data-client-user>@ana.ferreira</span> &nbsp;•&nbsp; Member since 05/03/2026</p>
          </div>
          <div class="actions">
            <label class="btn btn-outline">Change photo <input type="file" accept="image/*" hidden></label>
          </div>
        </section>

        <form id="profile-form" action="client-profile.html" method="post" class="flush content" data-success="Profile updated." data-keep-values>
          <section class="card">
            <h2 class="card-title">Personal information</h2>
            <div class="form-grid">
              <div class="field">
                <label for="name">Full name *</label>
                <input class="input" id="name" name="name" value="Ana Ferreira" autocomplete="name" required>
              </div>
              <div class="field">
                <label for="username">Username *</label>
                <input class="input" id="username" name="username" value="ana.ferreira" autocomplete="username"
                       pattern="[a-z0-9._]{3,30}" data-error="Use 3–30 lowercase letters, numbers, dots or _" required>
              </div>
              <div class="field">
                <label for="email">Email *</label>
                <input class="input" type="email" id="email" name="email" value="ana.ferreira@email.pt" autocomplete="email" required>
              </div>
              <div class="field">
                <label for="phone">Phone *</label>
                <input class="input" type="tel" id="phone" name="phone" data-phone value="+351 913 456 789" placeholder="+351 9XX XXX XXX" autocomplete="tel" required>
              </div>
              <div class="field">
                <label for="nif">NIF *</label>
                <input class="input" type="text" id="nif" name="nif" value="198 765 432" data-digits="9" inputmode="numeric" required>
              </div>
              <div class="field">
                <label for="role">Role</label>
                <div class="input-wrap">
                  <input class="input" id="role" value="Client" readonly>
                  <span class="suffix">Read-only</span>
                </div>
              </div>
            </div>
          </section>

          <section class="card">
            <h2 class="card-title">Change password</h2>
            <div class="form-grid cols-3">
              <div class="field">
                <label for="pw-current">Current password</label>
                <input class="input" type="password" id="pw-current" name="current_password" autocomplete="current-password">
              </div>
              <div class="field">
                <label for="pw-new">New password</label>
                <input class="input" type="password" id="pw-new" name="new_password" minlength="8" autocomplete="new-password">
              </div>
              <div class="field">
                <label for="pw-confirm">Confirm new password</label>
                <input class="input" type="password" id="pw-confirm" name="confirm_password" data-match="pw-new" autocomplete="new-password">
              </div>
            </div>
            <p class="text-sm mt-12 text-muted">Minimum 8 characters, with at least one number. Leave blank to keep the current password.</p>
          </section>

          <div class="m-0 form-actions">
            <button type="submit" class="btn btn-orange">Save changes</button>
            <a href="client-profile.html" class="btn btn-danger">Cancel</a>
          </div>
        </form>
      </main>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/validation.js"></script>
  <script src="js/app.js"></script>
  <script src="js/client.js"></script>
</body>
</html>
